name: Official DBeaver native gate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Standard hosted GUI and accessibility tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyatspi python3-pil xdotool scrot xvfb openbox dbus-x11 libgtk-3-0t64 libwebkit2gtk-4.1-0
      - name: Verify official release metadata and exact bytes
        run: python3 scripts/fetch-consumer.py
      - name: Record actual bundled Java runtime
        run: /tmp/gridpass-native-gate/official/dbeaver/jre/bin/java -version 2> artifacts/native/java-version.txt
      - name: Disposable original SQLite fixture in the official native GUI
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- sh -c 'openbox > /tmp/gridpass-openbox.log 2>&1 & /usr/bin/python3 scripts/gui-bootstrap.py'
      - name: Preserve diagnostic evidence without vendor binaries or profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridpass-native-bootstrap
          path: artifacts/native
          if-no-files-found: error
